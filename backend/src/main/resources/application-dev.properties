# Local dev runs the same engine as production. The repositories use native SQL
# with Postgres-specific behaviour, so developing against H2 would leave those
# paths untested until deploy.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rackin}
spring.datasource.username=${DB_USERNAME:rackin_app}
# No default: the app should fail loudly rather than start with a guessed secret.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only checks the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
