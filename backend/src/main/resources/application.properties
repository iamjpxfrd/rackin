spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Local, gitignored overrides — chiefly DB_PASSWORD. Optional, so CI and prod
# (which supply real env vars) start fine without the file. See
# config/local.properties.example.
spring.config.import=optional:file:./config/local.properties

# Swagger UI at /swagger-ui.html, raw spec at /v3/api-docs (disabled in prod)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# lapsed / expiring thresholds (fixed per pilot decision, not runtime-configurable)
rackin.lapsed-days-default=14
rackin.expiring-days-default=7

# Shared key the tablet presents on Authorization: Bearer. No default, the same
# way DB_PASSWORD has none — an app that starts with a guessed key looks
# protected while accepting a key anyone can read in this file. Set it in
# config/local.properties for local development, or as a real env var elsewhere.
rackin.api-key=${RACKIN_API_KEY}
