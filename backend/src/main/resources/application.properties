spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Local, gitignored overrides — chiefly DB_PASSWORD. Optional, so CI and prod
# (which supply real env vars) start fine without the file. See
# config/local.properties.example.
spring.config.import=optional:file:./config/local.properties

# Swagger UI at /swagger-ui.html, raw spec at /v3/api-docs (disabled in prod)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# lapsed / expiring thresholds (fixed per pilot decision, not runtime-configurable)
rackin.lapsed-days-default=14
rackin.expiring-days-default=7
