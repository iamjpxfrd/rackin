# Production sync target: PostgreSQL, configured via env vars. The URL is
# composed from discrete host/port/database rather than one opaque DB_URL -
# Render's Postgres add-on (render.yaml) only exposes fromDatabase as
# separate host/port/database/user/password properties, not a ready
# jdbc:postgresql:// URL, and composing it here works the same way on any
# host that can supply those three values as env vars.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Versioned migrations (backend-schema.md Section 8). ddl-auto is validate, not
# update: Hibernate must never alter a production schema behind Flyway's back.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# No API explorer on the public sync target
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Origin the tablet serves the frontend from, comma-separated. Empty by default:
# an unset value disables CORS entirely rather than falling back to a wildcard
# that would accept sync pushes from any page.
rackin.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
