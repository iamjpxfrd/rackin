# In-memory H2 per test run. Flyway is off because V1 is written against
# PostgreSQL; Hibernate builds the schema from the entities instead.
spring.datasource.url=jdbc:h2:mem:rackin;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

rackin.lapsed-days-default=14
rackin.expiring-days-default=7

# The real key has no default so a misconfigured deploy fails loudly. Tests
# still need one to build the security context, so a fixed value lives here —
# it is only ever compared against itself.
rackin.api-key=test-api-key
