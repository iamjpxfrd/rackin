# Production sync target: PostgreSQL, configured via env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Versioned migrations (Flyway/Liquibase) called for before real gym data exists;
# ddl-auto=update is the accepted stopgap until then (backend-schema.md Section 8)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No API explorer on the public sync target
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
